<header class="site-header">
  <div class="wrap">
    <div class="site-header-inner">

      <a href="{{ site.baseurl }}/" class="site-title">
        {% include logo.html %}

        <span class="site-title-long">Explorings of The Deep</span>
        <span class="site-title-short">EoTD</span>
      </a>

      <nav class="site-nav">
        <a class="site-nav-link site-nav-link-desktop" href="{{ site.baseurl }}/">Home</a>

        <details class="site-nav-menu">
          <summary class="site-nav-hamburger" aria-label="Toggle navigation" role="button">
            <span></span>
            <span></span>
            <span></span>
          </summary>
          <div class="site-nav-dropdown">
            <a class="site-nav-link" href="{{ site.baseurl }}/">Home</a>
          </div>
        </details>
      </nav>

    </div>
  </div>
</header>
<script>
  (function() {
    var header = document.querySelector('.site-header');
    if (!header) return;
    var ticking = false;
    var lastY = window.scrollY || 0;
    function update() {
      ticking = false;
      var y = window.scrollY || 0;
      header.classList.toggle('is-scrolled', y > 8);
      var menuOpen = !!header.querySelector('details[open]');
      var scrollingDown = y > lastY;
      // Hide only after scrolling a bit down, and never while the mobile menu is open
      header.classList.toggle('is-hidden', scrollingDown && y > 200 && !menuOpen);
      lastY = y;
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });
    update();
  })();
</script>
